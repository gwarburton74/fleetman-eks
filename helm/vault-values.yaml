server:
  # Production mode - not dev mode
  dev:
    enabled: false

  # Persistent storage - storageClass set per-cloud (see vault-values-aws.yaml / vault-values-gcp.yaml)
  dataStorage:
    enabled: true
    size: 10Gi

  # High availability disabled for simplicity
  # In production you'd run 3+ replicas
  ha:
    enabled: false

  # Resource limits appropriate for sandbox
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 256Mi
      cpu: 250m

# Vault Agent Injector - this is what injects secrets into pods
injector:
  enabled: true

ui:
  enabled: true
  serviceType: ClusterIP